# Runtime env for the Cloud Run service, applied once with
# `gcloud run deploy --env-vars-file`. Copy to api.env.yaml (gitignored) and fill in.
# PORT is set by Cloud Run; APP_VERSION is baked into the image.
NODE_ENV: production
LOG_LEVEL: info
WEB_ORIGIN: https://invoice.tariqguesri.com
DATABASE_URL: postgresql://<user>:<password>@<neon-pooled-host>/neondb?sslmode=require
REDIS_URL: redis://default:<password>@<redis-cloud-host>:<port>
SENTRY_DSN: ''
