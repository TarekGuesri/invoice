name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1
    # Inlined into the web build; the value only matters for deployed builds.
    NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
    checks:
        name: Format, spelling, types, lint, unit tests, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - uses: actions/cache@v6
              with:
                  path: .turbo/cache
                  key: turbo-${{ runner.os }}-${{ github.sha }}
                  restore-keys: turbo-${{ runner.os }}-

            - run: bun install --frozen-lockfile

            - run: bun run format:check

            - run: bun run check:spelling

            - run: bun x turbo run check:types lint test build

            # Lint runs with --fix locally; in CI any auto-fix means unlinted code.
            - name: Fail if lint auto-fixed anything
              run: git diff --exit-code

    integration:
        name: Integration tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: invoice
                    POSTGRES_PASSWORD: invoice
                    POSTGRES_DB: invoice
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U invoice -d invoice"
                    --health-interval 5s --health-timeout 3s --health-retries 10
            redis:
                image: redis:7.4-alpine
                ports: ['6379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s --health-timeout 3s --health-retries 10
        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://invoice:invoice@localhost:5432/invoice
            REDIS_URL: redis://localhost:6379
            WEB_ORIGIN: http://localhost:3000
            # Test-only value; production's lives on the Cloud Run service.
            JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - run: bun install --frozen-lockfile

            - name: Apply migrations
              run: bun run db:deploy

            - run: bun x turbo run test:integration
