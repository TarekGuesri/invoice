version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      groups:
          npm:
              patterns: ['*']
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: docker
      directory: /apps/api
      schedule:
          interval: weekly
